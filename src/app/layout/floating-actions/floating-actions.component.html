<!-- Desktop Floating Corner Buttons (bottom-right) -->
<aside class="d-none d-md-flex flex-column gap-2 ks-floating-desktop" aria-label="Quick Admissions Contact">
  <!-- WhatsApp Button -->
  <a
    [href]="getWhatsAppUrl()"
    target="_blank"
    rel="noopener noreferrer"
    class="ks-fab ks-fab-whatsapp shadow-lg"
    aria-label="Chat with Admissions Helpdesk on WhatsApp"
    title="Chat on WhatsApp"
  >
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.18-2.587-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.311.045-.698.071-2.112-.516-1.807-.751-2.956-2.583-3.046-2.702-.09-.12-1.04-1.385-1.04-2.641 0-1.256.66-1.874.896-2.128.236-.254.516-.318.688-.318.172 0 .344.002.494.01.159.009.373-.06.584.446.217.521.737 1.799.8 1.93.064.13.107.283.021.454-.086.171-.129.278-.258.428-.129.15-.271.335-.387.45-.129.128-.264.267-.114.524.151.257.671 1.107 1.442 1.794.992.884 1.828 1.158 2.086 1.286.258.128.408.107.558-.064.15-.171.644-.75 1.019-.887.375-.138.835.064 1.189.236.354.172 1.341.656 1.571.77.23.114.384.171.441.268.057.098.057.568-.087.973zM12 2C6.477 2 2 6.477 2 12c0 1.891.524 3.66 1.434 5.176L2 22l4.982-1.309A9.957 9.957 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/>
    </svg>
    <span class="ks-fab-tooltip">{{ i18n.translate('action.whatsapp') }}</span>
  </a>

  <!-- Call Button -->
  <a
    [href]="'tel:' + config.primaryPhone"
    class="ks-fab ks-fab-phone shadow-lg"
    aria-label="Call Admissions Helpline"
    title="Call Helpline"
  >
    <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z"/>
    </svg>
    <span class="ks-fab-tooltip">{{ i18n.translate('action.callNow') }}</span>
  </a>
</aside>

<!-- Mobile Slim Bottom Action Bar (Fixed bottom on small viewports) -->
<nav class="d-md-none fixed-bottom ks-mobile-action-bar border-top shadow-lg" aria-label="Mobile Quick Actions">
  <div class="container-fluid d-flex p-0">
    <!-- Call Action -->
    <a [href]="'tel:' + config.primaryPhone" class="btn ks-mobile-btn flex-fill d-flex flex-column align-items-center justify-content-center py-2">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z"/>
      </svg>
      <span class="extra-small-para fw-semibold mt-1">{{ i18n.translate('action.callNow') }}</span>
    </a>

    <!-- WhatsApp Action -->
    <a [href]="getWhatsAppUrl()" target="_blank" rel="noopener noreferrer" class="btn ks-mobile-btn ks-mobile-whatsapp flex-fill d-flex flex-column align-items-center justify-content-center py-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.18-2.587-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.311.045-.698.071-2.112-.516-1.807-.751-2.956-2.583-3.046-2.702-.09-.12-1.04-1.385-1.04-2.641 0-1.256.66-1.874.896-2.128.236-.254.516-.318.688-.318.172 0 .344.002.494.01.159.009.373-.06.584.446.217.521.737 1.799.8 1.93.064.13.107.283.021.454-.086.171-.129.278-.258.428-.129.15-.271.335-.387.45-.129.128-.264.267-.114.524.151.257.671 1.107 1.442 1.794.992.884 1.828 1.158 2.086 1.286.258.128.408.107.558-.064.15-.171.644-.75 1.019-.887.375-.138.835.064 1.189.236.354.172 1.341.656 1.571.77.23.114.384.171.441.268.057.098.057.568-.087.973zM12 2C6.477 2 2 6.477 2 12c0 1.891.524 3.66 1.434 5.176L2 22l4.982-1.309A9.957 9.957 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/>
      </svg>
      <span class="extra-small-para fw-semibold mt-1">{{ i18n.translate('action.whatsapp') }}</span>
    </a>

    <!-- Apply Online Action -->
    <a routerLink="/apply" class="btn ks-mobile-btn ks-mobile-apply flex-fill d-flex flex-column align-items-center justify-content-center py-2">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm10.5 10a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h4.293L4.146 10.646a.5.5 0 0 0 .708.708L10.5 5.707V11.5a.5.5 0 0 0 .5.5z"/>
      </svg>
      <span class="extra-small-para fw-semibold mt-1">{{ i18n.translate('action.applyOnline') }}</span>
    </a>
  </div>
</nav>
